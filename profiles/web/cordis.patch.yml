# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: daily
- insert:
    - id: preset-daily
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: daily
        name: 日常
        order: 4
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: "@deepseek-ai/dsh-agent-instructions"
            config:
              maxBytes: 65536
          - id: tool-bash
            name: "@deepseek-ai/dsh-tool-bash"
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: "@deepseek-ai/dsh-tool-jobs"
          - id: skill-filesystem
            name: "@deepseek-ai/dsh-skill-filesystem"
          - id: tool-skill
            name: "@deepseek-ai/dsh-tool-skill"
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: "@deepseek-ai/dsh-plan-mode"
                config:
                  section: You are in plan mode. Explore without mutating anything, then call
                    exit_plan_mode with a decision-complete plan. Do not
                    implement until the user approves.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: "@deepseek-ai/dsh-compaction-basic"
              - id: command-compact
                name: "@deepseek-ai/dsh-command-compact"
              - id: tool-result-pruner
                name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: "@deepseek-ai/dsh-tool-subagent-control"
              - id: tool-subagent
                name: "@deepseek-ai/dsh-tool-subagent"
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: "@deepseek-ai/dsh-tool-subagent"
                config:
                  provider: fork
                  toolName: subagent_fork
          - id: tool-ask-user
            name: "@deepseek-ai/dsh-tool-ask-user"
          - id: tool-todo
            name: "@deepseek-ai/dsh-tool-todo"
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: "@deepseek-ai/dsh-tool-web"
            config:
              search: false
              fetch: true
          - id: present
            name: "@deepseek-ai/dsh-tool-present"
    - id: guard
      name: '@netcatty/dsh-guard'
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      magpie:
        displayName: Magpie
        apiKeyEnv: MAGPIE_GATEWAY_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:3425/v1
        # 模型清单由网关决定，不入库；magpie 启动后会自动同步
      magpie-anthropic:
        displayName: Magpie · Anthropic
        apiKeyEnv: MAGPIE_GATEWAY_KEY
        api: anthropic-messages
        baseURL: http://127.0.0.1:3425
        # 模型清单由网关决定，不入库；magpie 启动后会自动同步
      magpie-responses:
        displayName: Magpie · Responses
        apiKeyEnv: MAGPIE_GATEWAY_KEY
        api: openai-responses
        baseURL: http://127.0.0.1:3425/v1
        # 模型清单由网关决定，不入库；magpie 启动后会自动同步
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    retryPolicy:
      mode: normal
      maxRetries: 10
      backoff:
        initialDelayMs: 10000
        maxDelayMs: 120000
- id: ui-usage-billing
  config:
    # 真机的内网/CGNAT IP 本地自填，不入库（提交钩子会拦）
    trustedHosts: []
- id: mcp
  config:
    # 服务器、激活窗口/上限都在 ~/.dsh/dsh-plugins/dsh-mcp/settings.json（设置页可改）；
    # 这一行只声明懒加载与侧边栏偏好
    servers: []
    lazy: true
    showInSidebar: true
- id: agent-default-model # magpie
  config:
    provider: magpie
    model: "deepseek/deepseek-flash"
    reasoningEffort: "high"
