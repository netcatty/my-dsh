- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    retryPolicy:
      mode: normal
      maxRetries: 10
      backoff:
        initialDelayMs: 10000
        maxDelayMs: 120000
- id: ui-usage-billing
  config:
    # 真机的内网/CGNAT IP 本地自填，不入库（提交钩子会拦）
    trustedHosts: []
- id: mcp
  config:
    # Servers live in ~/.dsh/dsh-plugins/dsh-mcp/settings.json (settings page); this row only
    # carries the lazy defaults and the sidebar preference.
    servers: []
    lazy: true
    defaultTtlMinutes: 30
    showInSidebar: true
- id: agent-default-model # magpie
  config:
    provider: magpie
    model: "deepseek/deepseek-flash"
    reasoningEffort: "high"
